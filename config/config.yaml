# AI Automation Workflows Configuration

# LLM Configuration
llm:
  default_provider: "mock"  # Options: mock, openai, anthropic
  
  # OpenAI Configuration
  openai:
    api_key: "${OPENAI_API_KEY}"  # Set environment variable
    model: "gpt-3.5-turbo"
    max_tokens: 1000
    temperature: 0.7
  
  # Anthropic Configuration
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"  # Set environment variable
    model: "claude-3-sonnet-20240229"
    max_tokens: 1000
    temperature: 0.7
  
  # Mock Configuration (for testing)
  mock:
    response_delay: 0.1

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins: ["*"]
  
# Logging Configuration
logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"

# Workflow Configuration
workflows:
  # Email Agent Configuration
  email_agent:
    auto_respond: true
    response_categories: ["support_request", "inquiry", "complaint"]
    max_response_length: 500
  
  # Report Agent Configuration
  report_agent:
    default_report_types: ["daily", "weekly", "monthly"]
    output_formats: ["json", "html", "pdf"]
    save_reports: true
    reports_directory: "data/reports"
  
  # Summarizer Configuration
  summarizer:
    default_summary_length: 250
    max_key_points: 5
    supported_types: ["general", "executive", "detailed", "brief"]
  
  # Customer Support Configuration
  customer_support:
    auto_escalation: true
    escalation_triggers: ["urgent", "emergency", "critical"]
    knowledge_base_file: "data/knowledge_base.json"
    ticket_storage: "data/tickets"

# Data Configuration
data:
  # Sample data directory
  sample_inputs_directory: "data/sample_inputs"
  
  # Database Configuration (if using database)
  database:
    url: "sqlite:///data/automation.db"  # Default to SQLite
    echo: false
  
  # File Storage
  storage:
    reports_directory: "data/reports"
    logs_directory: "logs"
    temp_directory: "data/temp"

# Security Configuration
security:
  # API Keys
  api_keys:
    enabled: false
    header_name: "X-API-Key"
  
  # Rate Limiting
  rate_limiting:
    enabled: false
    requests_per_minute: 60
  
  # CORS
  cors:
    allow_origins: ["*"]
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

# Monitoring Configuration
monitoring:
  # Metrics
  metrics:
    enabled: false
    port: 9090
  
  # Health Checks
  health_checks:
    enabled: true
    interval: 30  # seconds

# Development Configuration
development:
  # Testing
  testing:
    mock_llm: true
    test_data_directory: "tests/data"
  
  # Debugging
  debug:
    verbose_logging: false
    print_requests: false
    print_responses: false

# Production Configuration
production:
  # Performance
  performance:
    worker_processes: 4
    worker_connections: 1000
  
  # Scaling
  scaling:
    enabled: false
    min_instances: 1
    max_instances: 10
